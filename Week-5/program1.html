<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
</head>

<body bgcolor="lightblue">

<center>
<h2>Simple Interest Calculator</h2>

<form onsubmit="calculateSI(); return false;">
<table border="1" bgcolor="white">
    <tr>
        <td>Customer Name</td>
        <td><input type="text" id="name" required></td>
    </tr>

    <tr>
        <td>Principal Amount</td>
        <td><input type="number" id="principal" required></td>
    </tr>

    <tr>
        <td>Rate of Interest (%)</td>
        <td><input type="number" id="rate" required></td>
    </tr>

    <tr>
        <td>Time (Years)</td>
        <td><input type="number" id="time" required></td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Calculate SI">
        </td>
    </tr>
</table>
</form>

<br>

<h3>Interest Information</h3>

<table border="1" bgcolor="white">
    <tr>
        <td>Name</td>
        <td><input type="text" id="rname" readonly></td>
    </tr>

    <tr>
        <td>Principal Amount</td>
        <td><input type="text" id="rprincipal" readonly></td>
    </tr>

    <tr>
        <td>Simple Interest</td>
        <td><input type="text" id="rsi" readonly></td>
    </tr>

    <tr>
        <td>Total Amount</td>
        <td><input type="text" id="rtotal" readonly></td>
    </tr>
</table>
</center>

<script>
function calculateSI()
{
    var name = document.getElementById("name").value;
    var principal = parseFloat(document.getElementById("principal").value);
    var rate = parseFloat(document.getElementById("rate").value);
    var time = parseFloat(document.getElementById("time").value);

    var si = (principal * rate * time) / 100;
    var total = principal + si;

    document.getElementById("rname").value = name;
    document.getElementById("rprincipal").value = principal.toFixed(2);
    document.getElementById("rsi").value = si.toFixed(2);
    document.getElementById("rtotal").value = total.toFixed(2);
}
</script>

</body>
</html>
